name: shine_kit
description: The shared design kit of the myShine and drShine apps (SmileLabs, Direction C).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.7
  flutter: ">=3.40.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter-Bold.ttf
          weight: 700
        - asset: fonts/Inter-ExtraBold.ttf
          weight: 800
    - family: InterDisplay
      fonts:
        - asset: fonts/InterDisplay-Bold.ttf
          weight: 700
        - asset: fonts/InterDisplay-ExtraBold.ttf
          weight: 800
